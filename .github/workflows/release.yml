name: release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve target kind
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: kind
        run: |
          kind="$(pnpm run cz print-tag-kind "$GITHUB_REF_NAME" | tail -n1)"
          test -n "$kind" || { echo "cz print-tag-kind produced no kind for $GITHUB_REF_NAME" >&2; exit 1; }
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  npm:
    name: publish to npm
    needs: resolve
    if: needs.resolve.outputs.kind == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run cz publish-tagged-target "$GITHUB_REF_NAME"

  pypi:
    name: publish to PyPI
    needs: resolve
    if: needs.resolve.outputs.kind == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run cz publish-tagged-target "$GITHUB_REF_NAME"
